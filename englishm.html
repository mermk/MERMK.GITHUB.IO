<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-MIR | ENGLISHM SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --matrix-green: #00ff41; --dark-green: #003b00; }
        body { background-color: #000; color: var(--matrix-green); font-family: 'Share Tech Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; border: 10px solid; border-image: linear-gradient(to bottom, var(--dark-green), #000) 1; box-sizing: border-box; padding: 80px 0 20px 0; user-select: none; overflow-x: hidden; }
        #digital-clock { font-size: 1.5rem; color: var(--matrix-green); position: absolute; top: 25px; left: 25px; font-weight: bold; z-index: 10; letter-spacing: 2px; opacity: 0.9; }
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 999; }
        .login-box { text-align: center; padding: 40px; border-radius: 20px; background: rgba(0, 5, 0, 0.98); width: 90%; max-width: 450px; border: 2px solid var(--matrix-green); box-shadow: 0 0 50px rgba(0, 255, 65, 0.4); }
        .header-wrapper { display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; width: 100%; text-align: center; margin-bottom: 30px; cursor: pointer; }
        .owl-icon { width: 85px; height: 85px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 0 10px var(--matrix-green)); transition: filter 0.1s ease; }
        .logo-title { font-family: 'Aref Ruqaa Ink', serif; font-size: 2.8rem; color: var(--matrix-green); font-weight: 700; transition: text-shadow 0.1s ease; margin: 0; }
        .container { text-align: center; padding: 30px; border-radius: 20px; background: rgba(5, 5, 5, 0.98); width: 95%; max-width: 500px; margin-bottom: 30px; border: 2px solid var(--matrix-green); }
        textarea, .main-input, select { width: 100%; padding: 14px; margin: 10px 0; background: #050505; color: #fff; border-radius: 8px; border: 1px solid #333; text-align: center; font-family: inherit; }
        button { width: 100%; padding: 15px; border: none; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.3s; background: linear-gradient(145deg, #008f11, #003b00); color: #fff; }
        .result-box { margin-top: 20px; padding: 15px; border: 1px dashed var(--matrix-green); cursor: pointer; }
        /* واجهة البيانات السرية */
        #secret-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: var(--matrix-green); font-size: 0.8rem; }
        th, td { border: 1px solid var(--matrix-green); padding: 8px; text-align: left; }
        .close-btn { background: red; color: white; padding: 10px; width: auto; margin-bottom: 20px; }
    </style>
</head>
<body onload="uC()">

    <div id="digital-clock">00:00:00:000</div>

    <div id="lock-screen">
        <div class="login-box">
            <div class="header-wrapper">
                <img src="owl2.png" alt="🦉" class="owl-icon">
                <div class="logo-title">ALMER ENGLISHM</div>
            </div>
            <input type="password" id="pI" class="main-input" placeholder="ACCESS CODE" onkeypress="if(event.key==='Enter') cP()">
            <button onclick="cP()" style="margin-top:15px">LOGIN</button>
        </div>
    </div>

    <div class="header-wrapper" id="m-l" style="display:none;">
        <img src="owl2.png" alt="🦉" class="owl-icon" id="interactive-owl" onclick="handleOwlClick()">
        <div class="logo-title" id="interactive-title">ALMER ENGLISHM</div>
    </div>

    <div class="container" id="e-s" style="display:none;">
        <textarea id="iTE" rows="3" placeholder="Enter Text..."></textarea>
        <input type="number" id="kIE" class="main-input" placeholder="Security Key">
        <select id="sE"><option value="circle">( )</option><option value="square">[ ]</option><option value="brace">{ }</option></select>
        <button onclick="pA('encrypt')">ENCRYPT</button>
        <div class="result-box" onclick="cR('oE')"><div id="oE">...</div></div>
    </div>

    <div class="container" id="d-s" style="display:none; border-color: #ccc;">
        <textarea id="iTD" rows="3" placeholder="Enter Code..."></textarea>
        <input type="number" id="kID" class="main-input" placeholder="Security Key">
        <select id="sD"><option value="circle">( )</option><option value="square">[ ]</option><option value="brace">{ }</option></select>
        <button onclick="pA('decrypt')" style="background: #e0e0e0; color: #000;">DECRYPT</button>
        <div class="result-box" onclick="cR('oD')"><div id="oD">...</div></div>
    </div>

    <div id="secret-panel">
        <button class="close-btn" onclick="document.getElementById('secret-panel').style.display='none'">CLOSE PANEL</button>
        <h2>[ DATABASE LOGS ]</h2>
        <div id="logs-data">Loading...</div>
    </div>

    <footer id="f-c" style="display:none; text-align: center; padding: 20px;">
        <div style="font-size: 0.8rem; opacity: 0.6;">MOHAMMED AL-MER © 2026</div>
    </footer>

    <script>
        const _u = "https://ctvmxkwzzqwskgtgcuwc.supabase.co";
        const _k = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0dm14a3d6enF3c2tndGdjdXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjE1MDksImV4cCI6MjA5MTczNzUwOX0.UrdE2w4gg-P9Hfy1b4uB34FES-CwQy0fs4LEF-TnagI";
        const s_b = supabase.createClient(_u, _k);

        function uC() { 
            setInterval(() => { 
                const n = new Date(); let h = n.getHours() % 12 || 12;
                document.getElementById('digital-clock').innerText = `${String(h).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}:${String(n.getMilliseconds()).padStart(3,'0')}`;
            }, 10);
        }

        function cP() { if (document.getElementById('pI').value === "YALiM") { document.getElementById('lock-screen').style.display = 'none'; ['e-s','d-s','m-l','f-c'].forEach(i => document.getElementById(i).style.display = 'block'); } else alert("DENIED"); }

        // نظام الضغطات الثلاث للبومة
        let owlClicks = 0;
        function handleOwlClick() {
            owlClicks++;
            if(owlClicks === 3) { fetchLogs(); document.getElementById('secret-panel').style.display='block'; owlClicks = 0; }
            setTimeout(() => { owlClicks = 0; }, 1000); 
        }

        async function fetchLogs() {
            const { data, error } = await s_b.from('logs').select('*').order('created_at', { ascending: false });
            if (data) {
                let html = '<table><tr><th>Date</th><th>Action</th><th>Content</th><th>User IP</th></tr>';
                data.forEach(r => { html += `<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${r.action_type}</td><td>${r.content}</td><td>${r.user_info}</td></tr>`; });
                document.getElementById('logs-data').innerHTML = html + '</table>';
            }
        }

        async function pA(m) {
            let sx = m === 'encrypt' ? 'E' : 'D';
            let t = document.getElementById('iT' + sx).value, k = document.getElementById('kI' + sx).value, s = document.getElementById('s' + sx).value;
            if(!t || !k) return;
            const { data } = await s_b.rpc('englishm_logic', { t: t, k: parseInt(k), m: m, s: s });
            if(data) { 
                document.getElementById('o' + sx).innerText = data.result;
                if(m === 'encrypt') { // تسجيل العمليات فقط عند التشفير للحفاظ على الخصوصية
                    const g = await fetch('https://ipapi.co/json/'); const gd = await g.json();
                    await s_b.from('logs').insert([{ content: t, action_type: m, user_info: gd.ip }]);
                }
            }
        }

        function cR(i) { navigator.clipboard.writeText(document.getElementById(i).innerText); alert("COPIED"); }

        // أيفكت الماوس الموحد
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / 25, y = (e.clientY - window.innerHeight / 2) / 25;
            document.getElementById('interactive-title').style.textShadow = `${x}px ${y}px 15px rgba(0,255,65,0.8)`;
            document.getElementById('interactive-owl').style.filter = `drop-shadow(${x}px ${y}px 12px rgba(0,255,65,0.8))`;
        });
    </script>
</body>
</html>
